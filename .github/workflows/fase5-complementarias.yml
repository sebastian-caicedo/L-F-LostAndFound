
name: Fase 5 - Pruebas complementarias

# Corre solo en cada cambio que llega a main y en cada Pull Request hacia main,
# y también se puede lanzar a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          # La misma versión que usa el proyecto (README) y fase5-integracion.yml.
          python-version: '3.14'

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Comprobar sintaxis Python
        working-directory: backend
        run: python -m compileall -q app

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: frontend
        run: npm run build
